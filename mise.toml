min_version = "2024.11.0"

[tools]
node = "20"       # Matches lts/iron from .nvmrc
bun = "latest"    # Task executor
"github:extism/js-pdk" = "1.6.0"  # extism-js compiler for interpreter-wasm
"github:WebAssembly/binaryen" = { version = "126", version_prefix = "version_" }  # wasm-merge, wasm-opt for extism-js
"github:extism/cli" = "1.6.3"  # run plugins in tests (SDK has ABI mismatch with js-pdk plugins)

[env]
MORPHIR_JVM_VERSION = "0.18.2"

[task_config]
# Tasks are discovered in .mise/tasks/ directory
# Directory structure creates namespaced tasks (build/cli.ts → build:cli)
