min_version = "2024.11.0"

[tools]
node = "20"       # Matches lts/iron from .nvmrc
bun = "latest"    # Task executor

[env]
MORPHIR_JVM_VERSION = "0.18.2"
_.path = ["./node_modules/.bin"]

[task_config]
# Tasks are discovered in .mise/tasks/ directory
# Directory structure creates namespaced tasks (build/cli.ts → build:cli)
