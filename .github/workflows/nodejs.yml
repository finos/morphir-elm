# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions
name: Node.js CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

env:
  SonatypeUrl: "https://finos.sonatype.app/platform/"
  SonatypeAppId: "morphir-elm"
  SonatypeScanTarget: "."
  ExcludeDirectory: "**/docs/ **/.*'"

jobs:
  # building project
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20.x]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with: 
          ref: ${{ github.event.pull_request.head.sha }}     

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Elm
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('**/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Download dependencies
        run: bun ci

      # Elm 0.19.1 has no lock on ~/.elm. `mise run build` starts several
      # `elm make` processes at once, and with a cold cache they compile the same
      # packages into ~/.elm together. One then reads a half-written artifact and
      # stops with "PROBLEM BUILDING DEPENDENCIES" on a random package. The cache
      # above is saved only after a green run, so a cold cache never recovered.
      # One serial `elm make` per elm.json fills ~/.elm first.
      - name: Build the Elm dependencies one project at a time
        run: |
          mise run build:check-elm-docs
          mise run build:cli2
          mise run build:try-morphir

      - name: Build
        run: mise run build

      - name: Running Test
        run: mise run test

      - uses: actions/upload-artifact@v4
        with:
          name: bun-lock
          path: bun.lock

  # Semgrep static code analysis
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    # needs: [cvescan]
    needs: [build]
    container:
      # A Docker image with Semgrep installed. Don't change this.
      image: returntocorp/semgrep
    # Skip any PR created by dependabot to avoid permission issues
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --severity ERROR
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
