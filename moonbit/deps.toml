# Files from finos/morphir-moonbit that the Elm generators read. They are data,
# not modules: finos/morphir-ir, finos/morphir-sdk-spec and finos/morphir-typing
# come from mooncakes at the versions that moon.mod imports. `mise run
# moonbit:deps` checks the files out, sparse and shallow, into
# moonbit/.deps/morphir-moonbit.
[morphir-moonbit]
repository = "https://github.com/finos/morphir-moonbit.git"
commit = "3a7b557796b1ce84d867cc9de8bbec7f024294b9"
paths = [
  "pkgs/morphir-sdk/conformance",
]
